    if (svg) { svg.setAttribute('width', size); svg.setAttribute('height', size); }
  }, [name, size]);
  return <span ref={ref} style={{ display: 'inline-flex', alignItems: 'center', lineHeight: 0, color: 'inherit' }} />;
}

  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
  .twk-row-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{font-weight:500}
  .twk-chips{display:flex;gap:6px}
  .twk-chip-c{flex:1;height:40px;border:0;border-radius:6px;cursor:pointer;
    box-shadow:0 0 0 .5px rgba(0,0,0,.12);transition:transform .12s,box-shadow .12s;position:relative}
  .twk-chip-c:hover{transform:translateY(-1px);box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 4px 10px rgba(0,0,0,.12)}
  .twk-chip-c[data-on="1"]{box-shadow:0 0 0 2px rgba(0,0,0,.85)}
  .twk-chip-c svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:12px;height:12px}
`;

function TweaksPanelMini({ children, title = 'Customize' }) {
  const [open, setOpen] = useState(false);
  const dragRef = useRef(null);
  const offsetRef = useRef({ x: 16, y: 16 });

  useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current; if (!panel) return;
    const r = panel.getBoundingClientRect();
    const startRight = window.innerWidth - r.right, startBottom = window.innerHeight - r.bottom;
    const sx = e.clientX, sy = e.clientY;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      panel.style.right = Math.max(8, offsetRef.current.x) + 'px';
      panel.style.bottom = Math.max(8, offsetRef.current.y) + 'px';
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{TWEAKS_CSS}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function ColorPicker({ label, value, options, onChange }) {
  const isLight = (hex) => {
    const h = hex.replace('#','').padEnd(6,'0');
    const n = parseInt(h,16);
    return ((n>>16)&255)*299 + ((n>>8)&255)*587 + (n&255)*114 > 148000;
  };
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <div className="twk-lbl">{label}</div>
      <div className="twk-chips">
        {options.map(c => (
          <button key={c} className="twk-chip-c" data-on={value === c ? '1' : '0'}
            style={{ background: c }} onClick={() => onChange(c)}
            title={c}>
            {value === c && (
              <svg viewBox="0 0 14 14" aria-hidden="true">
                <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
                  strokeLinecap="round" strokeLinejoin="round"
                  stroke={isLight(c) ? 'rgba(0,0,0,.78)' : '#fff'} />
              </svg>
            )}
          </button>
        ))}
      </div>
    </div>
  );
}

function ToggleControl({ label, value, onChange }) {
  return (
    <div className="twk-row-h">
      <span className="twk-lbl">{label}</span>
      <button className="twk-toggle" data-on={value ? '1' : '0'} onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}
